# Analyze and test on every push and pull request (DECISIONS 297).
#
# There was no CI for either: only an iOS build that ran no tests. The tests
# run in Europe/Brussels, because some of them only fail in a time zone with
# summer time, as the phones this app runs on have (DECISIONS 268).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolchain this project is developed and tested against; see ios.yml.
  FLUTTER_VERSION: 3.47.2

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get packages
        run: flutter pub get

      # Generated sources (*.g.dart, *.drift.dart) are committed, so
      # build_runner does not have to run here.

      - name: Analyze
        run: flutter analyze

      - name: Test
        env:
          TZ: Europe/Brussels
        run: flutter test
