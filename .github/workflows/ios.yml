# Builds the iOS app on a Mac runner, because there is no Mac here.
#
# The unsigned job runs on every push to main and produces an .ipa you can
# sideload. The signed job is switched off until the repository variable
# IOS_SIGNING is set to "true"; see the comments above it for what it needs.
name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

# One build at a time per branch; a newer push makes an older run pointless.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than "stable": pubspec.yaml asks for Dart ^3.13.2, which is
  # what Flutter 3.47.2 ships, and that is the toolchain this project is
  # developed and tested against. A floating channel would silently move the
  # SDK under a build nobody can reproduce.
  FLUTTER_VERSION: 3.47.2

jobs:
  unsigned:
    name: Unsigned build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Caches the SDK itself.
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ios/Pods
          # Podfile.lock is not in the repository yet - CocoaPods cannot run on
          # Windows, where this project is developed - so the Podfile and the
          # resolved Dart packages are what the key hangs on.
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'pubspec.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Get packages
        run: flutter pub get

      # Generated sources (*.g.dart, *.drift.dart) are committed, so
      # build_runner does not have to run here. If that ever changes, this is
      # where `dart run build_runner build --delete-conflicting-outputs` goes.

      - name: Write the Xcode configuration Pods needs
        # ios/Flutter/Generated.xcconfig is generated, not committed, and the
        # Podfile refuses to run without it. --config-only writes it without
        # building anything.
        run: flutter build ios --release --no-codesign --config-only

      - name: Install pods
        working-directory: ios
        run: pod install --repo-update

      - name: Build
        run: flutter build ios --release --no-codesign

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versie uit pubspec.yaml: ${VERSION}"

      - name: Package as .ipa
        # An .ipa is a zip with the .app inside a folder called Payload. An
        # unsigned one cannot be installed by iOS itself; a sideloader signs it
        # with your own Apple ID first. See docs/ios-build.md.
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP" || { echo "::error::$APP not found"; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry "FitLog-${{ steps.version.outputs.value }}-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh *.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: fitlog-ios-unsigned-${{ steps.version.outputs.value }}
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Signed build. Off until you switch it on.
  #
  # To enable:
  #   Settings -> Secrets and variables -> Actions -> Variables
  #     IOS_SIGNING = true
  #
  # And these Secrets, on the same page under "Secrets":
  #
  #   IOS_CERTIFICATE_BASE64
  #     Your Apple signing certificate as a .p12, base64 encoded. Export it
  #     from Keychain Access on a Mac, or download it from the developer
  #     portal, then:  base64 -i cert.p12 | pbcopy
  #
  #   IOS_CERTIFICATE_PASSWORD
  #     The password you set when exporting that .p12.
  #
  #   IOS_PROVISIONING_PROFILE_BASE64
  #     The .mobileprovision for be.fitlog.app, base64 encoded the same way.
  #     It has to list every device you want to install on.
  #
  #   APPLE_TEAM_ID
  #     The ten-character team identifier from
  #     https://developer.apple.com/account -> Membership details.
  #
  # All four require a paid Apple Developer Program membership. Without one,
  # use the unsigned job above and let Sideloadly or AltStore do the signing.
  # ---------------------------------------------------------------------------
  signed:
    name: Signed build
    runs-on: macos-latest
    timeout-minutes: 45
    if: vars.IOS_SIGNING == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'pubspec.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Import the signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install the provisioning profile
        run: |
          set -euo pipefail
          PROFILES=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES"
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" \
            | base64 --decode > "$PROFILES/build.mobileprovision"

      - name: Get packages
        run: flutter pub get

      - name: Write the Xcode configuration Pods needs
        run: flutter build ios --release --config-only

      - name: Install pods
        working-directory: ios
        run: pod install --repo-update

      - name: Fill in the team identifier
        # ios/ExportOptions.plist ships with __TEAM_ID__ so the repository
        # never has to hold one.
        run: |
          set -euo pipefail
          test -n "${{ secrets.APPLE_TEAM_ID }}" \
            || { echo "::error::APPLE_TEAM_ID is empty"; exit 1; }
          sed -i '' 's/__TEAM_ID__/${{ secrets.APPLE_TEAM_ID }}/' \
            ios/ExportOptions.plist

      - name: Build
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versie uit pubspec.yaml: ${VERSION}"

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: fitlog-ios-signed-${{ steps.version.outputs.value }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
